[package]
name = "rfuzz"
version = "0.2.2"
edition = "2021"
description = "A conservative Rust web fuzzer for authorized testing"
license-file = "LICENSE"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "socks", "rustls-tls", "http2"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
libc = "0.2"
indicatif = "0.17"
base64 = "0.22"
hex = "0.4"
md5 = "0.7"
rand = "0.8"
sha1 = "0.10"

[profile.dev]
debug = 0

[profile.test]
debug = 0
